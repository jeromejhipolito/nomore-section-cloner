[project]
name = "nomore-section-cloner"
version = "0.1.0"
description = "Claude Agent SDK script that rebuilds the first sections of a Shopify landing page as one editable Liquid section."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sectioncloner"
